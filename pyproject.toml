[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-error-correction-lab"
version = "0.1.0"
description = "An educational quantum error correction simulator and decoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
